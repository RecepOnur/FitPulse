name: Build FitPulse Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm install

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: ⚙️ Configure Android Environment
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > android/local.properties
          chmod +x android/gradlew

      - name: ⚡ Build Web Assets
        run: npm run build

      - name: 🔄 Sync Capacitor Android
        run: npx --yes cap sync android

      - name: 🔨 Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: 📤 Upload FitPulse APK
        uses: actions/upload-artifact@v4
        with:
          name: FitPulse-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
